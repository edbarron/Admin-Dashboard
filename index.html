<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard-container">
        
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <h2>Dashboard</h2>
            <nav>
                <ul>
                    <li>Home</li>
                    <li>Profile</li>
                    <li>Messages</li>
                    <li>History</li>
                    <li>Tasks</li>
                    <li>Communities</li>
                </ul>
            </nav>
            <div class="sidebar-bottom">
                <ul>
                    <li>Settings</li>
                    <li>Support</li>
                    <li>Privacy</li>
                </ul>
            </div>
        </aside>

        <!-- MAIN WRAPPER -->
        <div class="main-wrapper">
            
            <!-- HEADER -->
            <header class="header">
                <div class="search-bar">Search...</div>
                <div class="user-profile">Morgan Oakley</div>
            </header>

            <!-- MAIN CONTENT -->
            <main class="content-area">
                
                <!-- PROJECTS SECTION (LEFT) -->
                <section class="projects-section">
                    <h3>Your Projects</h3>
                    <div class="projects-grid">
                        <!-- Placeholder cards -->
                        <div class="card">Project 1</div>
                        <div class="card">Project 2</div>
                        <div class="card">Project 3</div>
                        <div class="card">Project 4</div>
                        <div class="card">Project 5</div>
                        <div class="card">Project 6</div>
                    </div>
                </section>

                <!-- SIDE PANEL (RIGHT) -->
                <aside class="side-panel">
                    <section class="announcements">
                        <h3>Announcements</h3>
                        <div class="card">Announcement content</div>
                    </section>
                    
                    <section class="trending">
                        <h3>Trending</h3>
                        <div class="card">Trending content</div>
                    </section>
                </aside>

            </main>
        </div>
    </div>

</body>
</html>
